server {
    listen 80;
    root /usr/share/nginx/html;

    # Les appels /api partent vers le backend (service « backend » du compose).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # Application monopage : toute autre URL renvoie index.html (React Router gère la route).
    location / {
        try_files $uri /index.html;
    }
}
