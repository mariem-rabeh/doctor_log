# Configuration Alembic. L'URL de la base vient de app.config (DATABASE_URL / .env).
# Commandes (depuis backend/, venv actif) :
#   alembic upgrade head                              applique toutes les migrations
#   alembic revision --autogenerate -m "message"      crée une migration depuis les modèles
#   alembic downgrade -1                              annule la dernière migration

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = logging.StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
